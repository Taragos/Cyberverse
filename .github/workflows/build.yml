name: CI Build
on:
  push:
    branches: [ "master", "feature/ci" ]
  pull_request:
    branches: [ "master" ]

jobs:
  server-tests:
    # The wire tests compile the client's protocol header with clang and zpp_bits and compare its bytes with the C#
    # writer's, so run them on both platforms the server runs on. Both runner images ship clang.
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v5
    - name: Check out zpp_bits for the wire tests
      run: git submodule update --init --depth 1 client/red4ext/deps/zpp_bits
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
    - name: Check the generated protocol files are up to date
      run: dotnet run server/Tools/GenerateProtocol.cs -- --check
    - name: Run the server tests
      run: dotnet test server/Managed.Tests
    - name: Run the accounts plugin tests
      # They start PostgreSQL and Keycloak containers. The Linux runner has Docker, so a missing engine is a failure
      # there; the Windows runner has no Linux containers and skips them.
      run: dotnet test server/Plugins/Accounts.Tests
      env:
        CYBERVERSE_REQUIRE_CONTAINERS: ${{ runner.os == 'Linux' && '1' || '0' }}
    - name: Run the characters plugin tests
      # PostgreSQL in a container, as above.
      run: dotnet test server/Plugins/Characters.Tests
      env:
        CYBERVERSE_REQUIRE_CONTAINERS: ${{ runner.os == 'Linux' && '1' || '0' }}

  docker-server:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0 # the tags, for the mod version
    - name: Read the mod version
      id: version
      run: echo "version=$(git describe --tags --always --dirty --match 'v[0-9]*')" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@v4
    - name: Build the Docker image
      uses: docker/build-push-action@v7
      with:
        context: server
        file: server/Dockerfile
        push: false
        load: true # needed so the smoke test below can run the image
        tags: cyberverse-server:ci
        build-args: CYBERVERSE_VERSION=${{ steps.version.outputs.version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Smoke test the server image
      # The native library only prints this line after GameNetworkingSockets initialized and the socket is listening,
      # so it also catches missing/unresolvable .so files, which a managed-only log line would not.
      run: |
        docker run -d --name cyberverse-server cyberverse-server:ci
        for i in $(seq 1 30); do
          logs=$(docker logs cyberverse-server 2>&1)
          if grep -q 'Server listening on port 1337' <<< "$logs" && [ -n "$(docker ps -q -f name=cyberverse-server)" ]; then
            echo "Server is up"
            exit 0
          fi
          [ -z "$(docker ps -q -f name=cyberverse-server)" ] && break
          sleep 1
        done
        echo "::error::Server did not start listening on port 1337" >&2
        docker logs cyberverse-server
        exit 1

  client-linux-cross:
    # The same plugin as the client job, cross-compiled on Linux with clang-cl + xwin (tools/linux/build-client.sh), so
    # a change that only builds with MSVC shows up here. The build environment comes from GHCR (build-image.yml); when
    # the Containerfile changed and that image isn't published yet, container.sh builds it here instead.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0 # the tags, for the mod version (shared/version/CyberverseVersion.cmake)
      - name: Cache vcpkg binary packages
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: vcpkg-cross-${{ hashFiles('client/red4ext/vcpkg.json', 'client/red4ext/cross/**', 'tools/linux/Containerfile') }}
          restore-keys: vcpkg-cross-
      - name: Log in to GHCR
        # Pull requests from forks get no package access; they fall back to building the image.
        continue-on-error: true
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Cross-build the plugin
        env:
          CONTAINER: docker
          VCPKG_CACHE_DIR: ${{ github.workspace }}/.vcpkg-binary-cache
        run: |
          export IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cyberverse-build:$(tools/linux/image-tag.sh)"
          tools/linux/build-client.sh
      - uses: actions/upload-artifact@v7
        with:
          name: RED4ext Plugin (Linux cross-build)
          path: client/red4ext/build/linux-cross/src/*.dll

  client:
    runs-on: windows-latest

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      # vcpkg removed the x-gha backend, so use a plain directory and cache it via actions/cache.
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0 # the tags, for the mod version (shared/version/CyberverseVersion.cmake)
      - name: Cache vcpkg binary packages
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: vcpkg-binary-${{ runner.os }}-${{ hashFiles('client/red4ext/vcpkg.json', 'client/red4ext/cross/ports/**', '.github/workflows/build.yml') }}
          restore-keys: vcpkg-binary-${{ runner.os }}-
      - uses: lukka/get-cmake@latest
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@main
        id: runvcpkg
        with:
          # The vcpkg.json file, which will be part of cache key computation. Without a vcpkgGitCommitId, run-vcpkg also
          # checks vcpkg out at this manifest's builtin-baseline.
          vcpkgJsonGlob: 'client/red4ext/vcpkg.json'
      - name: Generate build output folder
        run: mkdir '${{ github.workspace }}\client\red4ext\build\ninja-vcpkg'
      - name: Run CMake with vcpkg.json manifest
        uses: lukka/run-cmake@v10
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/client/red4ext/CMakeLists.txt'
          configurePreset: ninja-vcpkg
          buildPreset: ninja-vcpkg
          buildPresetAdditionalArgs: '[`--config Release`]'
      - name: List $RUNNER_WORKSPACE after build
        run: find $RUNNER_WORKSPACE
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: RED4ext Plugin
          path: client/red4ext/build/ninja-vcpkg/src/*.dll
