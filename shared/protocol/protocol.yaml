# The wire protocol between the game client and the server: every packet, enum and struct they exchange. This file is
# the only definition. After editing it, regenerate both sides and commit the result:
#
#   dotnet run server/Tools/GenerateProtocol.cs
#
# It writes shared/protocol/Protocol.h (C++ structs for the client, serialized with zpp_bits) and
# server/Managed/Protocol/Generated/Protocol.g.cs (C# structs with their reader and writer). The native server library
# never sees packet types: it passes raw bytes between the network and C#.
#
# Wire format, which is what zpp_bits writes for the C++ structs: a 4 byte header (u8 channel, u16 message id, u8 zero),
# then the fields in order, little endian, without padding. bool is 1 byte, an enum its underlying type, a struct its
# fields, a string a u32 byte count and UTF-8 bytes, an array (T[]) a u32 element count and the elements.
#
# Field types: u8 u16 u32 u64 i8 i16 i32 i64 f32 f64 bool string, an enum or struct defined here, or an array of any of
# them. A field is either `name: type` or `name: { type: ..., max: N, doc: ... }`. max applies to strings (bytes) and
# arrays (elements); the server rejects longer ones when reading.
#
# Packets: id is the message id within its direction, channel the GameNetworkingSockets lane, reliable whether it is
# resent until it arrives. The protocol version both sides compare at login is a hash of everything in this file except
# comments and doc texts, so any other change makes old clients and servers incompatible.
#
# The login packets (id 0 in each direction: InitAuth and InitAuthResult) are frozen: their layout never changes, so a
# client of any version can still log in far enough to read why the server turned it away. `frozen` holds a fingerprint
# of the layout and the generator fails when it no longer matches. Put new login data into a later packet. Appending a
# value to EAuthResult is safe (old clients show the message for any result but Ok) and only needs a new fingerprint.

enums:
  EAuthResult:
    type: u8
    values: [Ok, VersionMismatch, ValidationFailed]
    doc: ValidationFailed covers everything from a wrong password to being banned. Part of the frozen InitAuthResult.
  EPlayerAction:
    type: u8
    values: [Jump, RangedAttack]

structs:
  Vector3:
    fields:
      - x: f32
      - y: f32
      - z: f32
  CharacterInfo:
    doc: One entry of the character select screen.
    fields:
      - characterId: { type: string, max: 36, doc: A GUID }
      - name: { type: string, max: 160, doc: "\"Firstname Lastname\"" }
      - lastPlayedUnix: { type: i64, doc: "Seconds since 1970 (UTC) of the last time it was played; 0 for never" }

serverbound:
  InitAuth:
    id: 0
    channel: 0
    reliable: true
    doc: The first packet of a connection. Frozen, see the top of this file.
    frozen: 0efbf337
    fields:
      - protocolVersion: u32
      - username: { type: string, max: 255, doc: UTF-8 }
      - modVersion: { type: string, max: 64, doc: "The client's build, from git describe, e.g. v0.1.0-12-gaba70a7" }
      - gameVersion: { type: string, max: 32, doc: "The game's product version as RED4ext reports it, e.g. 2.31.0" }
  PlayerJoinWorld:
    id: 1
    channel: 0
    reliable: true
    fields:
      - position: Vector3
  PlayerActionTracked:
    id: 2
    channel: 1
    reliable: true
    fields:
      - action: EPlayerAction
      - worldTransform: Vector3
  PlayerPositionUpdate:
    id: 3
    channel: 1
    reliable: true
    fields:
      - worldTransform: Vector3
      - yaw: f32
  PlayerSpawnCar:
    id: 4
    channel: 0
    reliable: true
    fields:
      - worldTransform: Vector3
      - yaw: f32
      - recordId: { type: u64, doc: "TweakDBID: u32 CRC32 of the name, u8 name length, 3 bytes TweakDB offset" }
  # id 5 was PlayerMountCar, which was never sent.
  PlayerUnmountCar:
    id: 6
    channel: 0
    reliable: true
    fields: []
  PlayerEquipItem:
    id: 7
    channel: 0
    reliable: true
    fields:
      - slot: u64
      - itemId: u64
      - isWeapon: bool
      - isUnequipping: bool
  PlayerShoot:
    id: 8
    channel: 0
    reliable: true
    fields:
      - itemIdWeapon: { type: u64, doc: "The weapon's TweakDBID; should become the item id." }
      - startPoint: Vector3
      - charge: f32
  LoginWithSession:
    id: 9
    channel: 0
    reliable: true
    doc: >-
      Sent right after InitAuth. The server answers with InitAuthResult once the login is decided; in between it may
      send LoginRequired (the player has to log in in the browser) and SessionIssued.
    fields:
      - sessionToken: { type: string, max: 128, doc: "The token from an earlier SessionIssued, or empty for none" }
      - deviceName: { type: string, max: 64, doc: "The PC's name, so players can tell their sessions apart" }
  CharacterCreate:
    id: 10
    channel: 0
    reliable: true
    doc: Creates a character from the select screen. The server answers with CharacterList or CharacterRequestFailed.
    fields:
      - firstName: { type: string, max: 64, doc: "2 to 16 letters, ' and -" }
      - lastName: { type: string, max: 64, doc: "2 to 16 letters, ' and -" }
      - appearance: { type: string, max: 16384, doc: "The character creator's options as the client encodes them; may be empty" }
  CharacterSelect:
    id: 11
    channel: 0
    reliable: true
    doc: Plays as this character. The server answers with CharacterSpawned or CharacterRequestFailed.
    fields:
      - characterId: { type: string, max: 36 }
  CharacterDelete:
    id: 12
    channel: 0
    reliable: true
    doc: Deletes one of the player's characters (an admin can restore it). Answered with CharacterList or CharacterRequestFailed.
    fields:
      - characterId: { type: string, max: 36 }
  CharacterAppearance:
    id: 13
    channel: 0
    reliable: true
    doc: The appearance of the character being played changed, e.g. at a mirror. Saved; no answer.
    fields:
      - appearance: { type: string, max: 16384 }

clientbound:
  InitAuthResult:
    id: 0
    channel: 0
    reliable: true
    doc: The answer to InitAuth. Frozen, see the top of this file. After any result but Ok the server closes the connection.
    frozen: a29bee02
    fields:
      - authResult: EAuthResult
      - protocolVersion: u32
      - modVersion: { type: string, max: 64, doc: "The server's build, from git describe" }
      - message: { type: string, max: 1024, doc: "Why the login failed, written for the player. Empty when authResult is Ok" }
  SpawnEntity:
    id: 1
    channel: 1
    reliable: true
    fields:
      - networkedEntityId: u64
      - recordId: u64
      - spawnPosition: Vector3
  TeleportEntity:
    id: 2
    channel: 1
    reliable: true
    fields:
      - networkedEntityId: u64
      - targetPosition: Vector3
      - yaw: { type: f32, doc: "NPCs (players too) only have a yaw that can be set, not a full rotation." }
  DestroyEntity:
    id: 3
    channel: 1
    reliable: true
    fields:
      - networkedEntityId: u64
  EquipItemEntity:
    id: 4
    channel: 0
    reliable: true
    fields:
      - networkedEntityId: u64
      - slot: u64
      - itemId: u64
      - isWeapon: bool
      - isUnequipping: bool
  LoginRequired:
    id: 5
    channel: 0
    reliable: true
    doc: The session token was missing or no longer valid. The player logs in in the browser while the client waits.
    fields:
      - verificationUri: { type: string, max: 512, doc: "The login page with the code filled in" }
      - userCode: { type: string, max: 32, doc: "The code to compare with the one the login page shows" }
      - expiresInSeconds: u32
  SessionIssued:
    id: 6
    channel: 0
    reliable: true
    doc: A new session for this PC. The client saves the token and sends it in LoginWithSession next time.
    fields:
      - sessionToken: { type: string, max: 128 }
  CharacterList:
    id: 7
    channel: 0
    reliable: true
    doc: >-
      The player's characters, for the select screen. Sent after PlayerJoinWorld while no character is being played, and
      after a create or delete.
    fields:
      - characters: { type: "CharacterInfo[]", max: 16 }
      - maxCharacters: { type: u8, doc: How many characters the account may have }
  CharacterRequestFailed:
    id: 8
    channel: 0
    reliable: true
    doc: A CharacterCreate, CharacterSelect or CharacterDelete was refused.
    fields:
      - message: { type: string, max: 1024, doc: "Why, written for the player" }
  CharacterSpawned:
    id: 9
    channel: 0
    reliable: true
    doc: >-
      The player now plays this character: also sent again after a repeated PlayerJoinWorld (e.g. a reload). The client
      moves the player to position when teleport is set and applies the appearance.
    fields:
      - characterId: { type: string, max: 36 }
      - name: { type: string, max: 160 }
      - teleport: { type: bool, doc: "False for a new character: it stays where the game loaded" }
      - position: Vector3
      - yaw: f32
      - appearance: { type: string, max: 16384 }
  EntityLook:
    id: 10
    channel: 1
    reliable: true
    doc: >-
      A player character's look, sent right after its SpawnEntity (same channel, so it arrives after it) and again when
      its owner saves a new look. The client applies it to the V puppet through its look table (CYB-00029).
    fields:
      - networkedEntityId: u64
      - appearance: { type: string, max: 16384, doc: "The stored look, \"v1 body=m name=value ...\"; empty: a default V" }
